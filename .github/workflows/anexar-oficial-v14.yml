name: Anexar APK oficial V14 validado
on:
  push:
    branches: [anexar-oficial-pro-v14]
permissions:
  contents: write
jobs:
  anexar:
    if: github.repository == 'pellegriny2020/pellegriny-piloto-atualizacoes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Conferir APK e manifesto prontos sem compilar
        working-directory: releasev14
        run: sha256sum --check SHA256SUMS.txt
      - name: Anexar somente ao rascunho oficial 1072
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: pellegriny2020/pellegriny-piloto-atualizacoes
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pellegriny2020/pellegriny-piloto-atualizacoes'
          test "$(gh release view v1072 --json isDraft --jq .isDraft)" = 'true'
          gh release upload v1072 releasev14/Lucro-na-Tela-Pro-v14.apk releasev14/atualizacao.json releasev14/SHA256SUMS.txt --clobber
