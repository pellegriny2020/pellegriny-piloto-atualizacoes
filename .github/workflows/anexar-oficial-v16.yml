name: Anexar APK oficial V16 validado
on:
  push:
    branches: [anexar-oficial-pro-v16]
permissions:
  contents: write
jobs:
  anexar:
    if: github.repository == 'pellegriny2020/pellegriny-piloto-atualizacoes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Conferir APK e manifesto prontos sem compilar
        working-directory: releasev16
        run: sha256sum --check SHA256SUMS.txt
      - name: Anexar somente ao rascunho oficial 1074
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: pellegriny2020/pellegriny-piloto-atualizacoes
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pellegriny2020/pellegriny-piloto-atualizacoes'
          test "$(gh release view v1074 --json isDraft --jq .isDraft)" = 'true'
          gh release upload v1074 releasev16/Lucro-na-Tela-Pro-v16.apk releasev16/atualizacao.json releasev16/SHA256SUMS.txt --clobber
