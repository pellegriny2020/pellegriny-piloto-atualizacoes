name: Anexar APK oficial 1057 validado
on:
  push:
    branches: [anexar-oficial-pro-1057]
permissions:
  contents: write
jobs:
  anexar:
    if: github.repository == 'pellegriny2020/pellegriny-piloto-atualizacoes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Conferir APK pronto sem compilar
        working-directory: release1057
        run: |
          sha256sum --check SHA256SUMS.txt
          echo '8fa4a50bcef9f4b4ee775bf08824e08bb95e15f9674876889a8273e574cc962d  Lucro-na-Tela-1057.apk' | sha256sum --check
      - name: Anexar somente ao rascunho oficial 1057
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: pellegriny2020/pellegriny-piloto-atualizacoes
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pellegriny2020/pellegriny-piloto-atualizacoes'
          test "$(gh release view v1057 --json isDraft --jq .isDraft)" = 'true'
          gh release upload v1057 release1057/Lucro-na-Tela-1057.apk release1057/atualizacao.json release1057/SHA256SUMS.txt --clobber
